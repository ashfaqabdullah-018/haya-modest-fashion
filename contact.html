<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Haya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Haya</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count">0</span></a>
        <button class="mobile-toggle">☰</button>
      </div>
    </div>
  </header>
  <section class="shop-header">
    <div class="container">
      <h1 style="font-size:2rem;font-weight:500;">Contact Us</h1>
      <p style="color:#666;">We would love to hear from you</p>
    </div>
  </section>
  <div class="container" style="padding:3rem 0;max-width:600px;">
    <div class="contact-form">
      <h3 style="margin-bottom:1.5rem;">Send a Message</h3>
      <form id="contactForm">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" required placeholder="Full name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea required placeholder="How can we help?"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
      </form>
    </div>
    <div style="margin-top:2rem;">
      <p><strong>Email:</strong> hello@haya.com</p>
      <p><strong>WhatsApp:</strong> <a href="https://wa.me/1234567890">Message us</a></p>
      <p><strong>Instagram:</strong> @haya.modest</p>
    </div>
  </div>
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>© 2026 Haya. All rights reserved.</p></div>
    </div>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
